[package]
name = "sing-box-reticulum-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["real-reticulum"]
real-reticulum = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
rand_core = "0.6"
reticulum-rs = { version = "0.2", features = ["core", "transport"] }
