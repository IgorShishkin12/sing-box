plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.singbox.ble'
    compileSdk 34

    defaultConfig {
        applicationId "com.singbox.ble"
        minSdk 26
        targetSdk 31
        versionCode 1
        versionName "1.0"
    }

    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // btleplug AAR — built by ble-deps via btleplug's own ./gradlew (AGP 7.4 + Gradle 7.x).
    // Bundles btleplug's Java layer + jni-utils. Dropped in by ble-builder Docker stage.
    if (file("btleplug.aar").exists()) {
        implementation files("btleplug.aar")
    }
}
