plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.singbox.ble'
    compileSdk 34

    defaultConfig {
        applicationId "com.singbox.ble"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // jni-utils and btleplug Java sources are compiled directly from src/main/java/
    // (copied in by the ble-builder Docker stage). No Maven dep needed.
}
