name: retv2bench-reticulum

services:
  e2e-server:
    image: retv2e2e-server:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.server
    command: >
      -c "
        sum-server &> /dev/null &
        sing-box run -c /etc/sing-box/config.json
      "
    volumes:
      - ./configs/server.json:/etc/sing-box/config.json:ro
    networks:
      - bench-net
    expose:
      - "7788"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8080/sum -H 'Content-Type: application/json' -d '{\"a\":1,\"b\":1}' > /dev/null 2>&1 && pgrep -x sing-box > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  bench-client:
    image: retv2e2e-client:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    command: >
      -c "
        sing-box run -c /etc/sing-box/config.json &
        e2e-bench -mode proxy -socks 127.0.0.1:1080 -url http://127.0.0.1:8080 -output /bench-results/reticulum.txt &&
        echo 'RETICULUM BENCHMARKS DONE'
      "
    volumes:
      - ./configs/client.json:/etc/sing-box/config.json:ro
      - ./bench-results:/bench-results
    networks:
      - bench-net
    depends_on:
      e2e-server:
        condition: service_healthy

networks:
  bench-net:
    driver: bridge

