name: retv2run

services:
  e2e-server:
    image: retv2e2e-server:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.server
    command: >
      -c "
        sing-box run -c /etc/sing-box/config.json
      "
    volumes:
      - ./configs/server.json:/etc/sing-box/config.json:ro
    networks:
      - e2e-net
      - server-internet
    expose:
      - "7788"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sing-box > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  e2e-client:
    image: retv2e2e-client:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    cap_add:
      - NET_ADMIN
    command: >
      -c "
        ip route del default 2>/dev/null || true &&
        sing-box run -c /etc/sing-box/config.json &
        sleep 20 &&
        echo 'Verifying client has no direct internet access...' &&
        ! curl -sf --max-time 5 http://example.com > /dev/null 2>&1 &&
        echo 'Confirmed: direct internet access is blocked' &&
        RESP=$$(curl -sf --max-time 30 --socks5-hostname 127.0.0.1:1080 http://example.com) &&
        echo \"Response preview: $$(echo \"$$RESP\" | head -3)\" &&
        echo \"$$RESP\" | grep -q 'Example Domain' &&
        echo 'E2E TEST PASSED: example.com fetched via reticulum proxy'
      "
    volumes:
      - ./configs/client.json:/etc/sing-box/config.json:ro
    networks:
      - e2e-net
    depends_on:
      e2e-server:
        condition: service_healthy

networks:
  e2e-net:
    driver: bridge
    internal: true
  server-internet:
    driver: bridge
