name: retv2e2e

services:
  e2e-server:
    image: retv2e2e-server:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.server
    command: >
      -c "
        sum-server &
        sleep 2 &&
        sing-box run -c /etc/sing-box/config.json
      "
    volumes:
      - ./configs/server.json:/etc/sing-box/config.json:ro
    networks:
      - e2e-net
    expose:
      - "7788"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sing-box > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  e2e-android-client:
    image: retv2e2e-android-client:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.android-client
    devices:
      - /dev/kvm:/dev/kvm
    networks:
      - e2e-net
    depends_on:
      e2e-server:
        condition: service_healthy

networks:
  e2e-net:
    driver: bridge
