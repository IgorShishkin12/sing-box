name: retv2run

services:
  e2e-server:
    image: retv2e2e-server:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.server
    command: >
      -c "
        sum-server &
        sleep 2 &&
        sing-box run -c /etc/sing-box/config.json
      "
    volumes:
      - ./configs/server.json:/etc/sing-box/config.json:ro
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sing-box > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  e2e-client:
    image: retv2e2e-client:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    command: >
      -c "
        sing-box run -c /etc/sing-box/config.json &
        sleep 20 &&
        RESP=$(curl -sf --socks5-hostname 127.0.0.1:1080 http://127.0.0.1:8080/sum \
          -H 'Content-Type: application/json' -d '{\"a\":3,\"b\":5}') &&
        echo \"Response: $$RESP\" &&
        echo \"$$RESP\" | grep -q '\"sum\":8' &&
        echo 'E2E TEST PASSED: 3 + 5 = 8'
      "
    volumes:
      - ./configs/client.json:/etc/sing-box/config.json:ro
    networks:
      - e2e-net
    depends_on:
      e2e-server:
        condition: service_healthy

networks:
  e2e-net:
    driver: bridge
