name: retv2e2e

services:
  e2e-server:
    image: retv2e2e-server:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.server
    command: >
      -c "
        sum-server &
        sing-box run -c /etc/sing-box/config.json
      "
    volumes:
      - ./configs/server-auto.json:/etc/sing-box/config.json:ro
    networks:
      - e2e-net
    expose:
      - "49555"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8080/sum -H 'Content-Type: application/json' -d '{\"a\":1,\"b\":1}' > /dev/null 2>&1 && pgrep -x sing-box > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  e2e-client:
    image: retv2e2e-client:latest
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    command: >
      -c "
        sing-box run -c /etc/sing-box/config.json &
        e2e-loadtest --socks 127.0.0.1:1080 --url http://127.0.0.1:8080 &&
        echo 'ALL E2E TESTS PASSED'
      "
    volumes:
      - ./configs/client-auto.json:/etc/sing-box/config.json:ro
    networks:
      - e2e-net
    depends_on:
      e2e-server:
        condition: service_healthy

networks:
  e2e-net:
    driver: bridge
