name: Check Secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target to validate secrets for"
        required: true
        type: choice
        default: "All"
        options:
          - All
          - Binary
          - Android
          - Apple
          - app-store
          - iOS
          - macOS
          - tvOS
          - macOS-standalone
          - publish-android
          - Linux

jobs:
  check:
    name: Check secrets for ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      SECRET_GPG_KEY: ${{ secrets.GPG_KEY }}
      SECRET_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      SECRET_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      SECRET_LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      SECRET_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      SECRET_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.SERVICE_ACCOUNT_CREDENTIALS }}
      SECRET_CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      SECRET_P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      SECRET_PROVISIONING_PROFILES: ${{ secrets.PROVISIONING_PROFILES }}
      SECRET_ASC_KEY: ${{ secrets.ASC_KEY }}
      SECRET_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      SECRET_ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      SECRET_FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
    steps:
      - name: Validate secrets
        run: |
          MISSING=0
          check() {
            if [[ -z "$2" ]]; then
              echo "❌ MISSING: $1"
              MISSING=$((MISSING + 1))
            else
              echo "✅ OK: $1"
            fi
          }
          check_binary() {
            check GPG_KEY               "$SECRET_GPG_KEY"
            check GPG_PASSPHRASE        "$SECRET_GPG_PASSPHRASE"
            check GPG_KEY_ID            "$SECRET_GPG_KEY_ID"
          }
          check_android() {
            check LOCAL_PROPERTIES      "$SECRET_LOCAL_PROPERTIES"
            check RELEASE_KEYSTORE      "$SECRET_RELEASE_KEYSTORE"
          }
          check_apple() {
            check CERTIFICATES_P12      "$SECRET_CERTIFICATES_P12"
            check P12_PASSWORD          "$SECRET_P12_PASSWORD"
            check PROVISIONING_PROFILES "$SECRET_PROVISIONING_PROFILES"
            check ASC_KEY               "$SECRET_ASC_KEY"
            check ASC_KEY_ID            "$SECRET_ASC_KEY_ID"
            check ASC_KEY_ISSUER_ID     "$SECRET_ASC_KEY_ISSUER_ID"
          }
          check_linux() {
            check_binary
            check FURY_TOKEN            "$SECRET_FURY_TOKEN"
          }

          case "${{ inputs.target }}" in
            All)
              check_binary
              check_android
              check SERVICE_ACCOUNT_CREDENTIALS "$SECRET_SERVICE_ACCOUNT_CREDENTIALS"
              check_apple
              check FURY_TOKEN "$SECRET_FURY_TOKEN"
              ;;
            Binary)
              check_binary ;;
            Android)
              check_android ;;
            publish-android)
              check_android
              check SERVICE_ACCOUNT_CREDENTIALS "$SECRET_SERVICE_ACCOUNT_CREDENTIALS"
              ;;
            Apple|app-store|iOS|macOS|tvOS|macOS-standalone)
              check_apple ;;
            Linux)
              check_linux ;;
          esac

          echo ""
          if [[ $MISSING -gt 0 ]]; then
            echo "❌ $MISSING secret(s) missing for target: ${{ inputs.target }}"
            exit 1
          else
            echo "✅ All required secrets present for target: ${{ inputs.target }}"
          fi
