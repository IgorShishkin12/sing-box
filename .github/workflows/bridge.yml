name: Rust Bridge

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (e.g., x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu)"
        required: true
        type: string
      profile:
        description: "Build profile: debug or release"
        required: false
        default: "release"
        type: string
      os:
        description: "Runner OS"
        required: false
        default: "ubuntu-latest"
        type: string
    outputs:
      lib-path:
        description: "Path to the built static library"
        value: ${{ jobs.build.outputs.lib-path }}
  workflow_dispatch:
  push:
    branches:
      - stable
      - testing
      - main
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (no default features)
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run tests (no default features)
        run: cargo test --no-default-features -- --test-threads=1

  test_default:
    name: Test (default features)
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run tests (default features)
        run: cargo test -- --test-threads=1

  build:
    name: Build bridge (${{ inputs.target || 'x86_64-unknown-linux-gnu' }}, ${{ inputs.profile || 'release' }})
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: bridge
    outputs:
      lib-path: ${{ steps.set-lib-path.outputs.lib-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ inputs.target || 'x86_64-unknown-linux-gnu' }}

      - name: Install cross-compilation toolchain
        run: |
          TARGET="${{ inputs.target || 'x86_64-unknown-linux-gnu' }}"
          case "$TARGET" in
            aarch64-unknown-linux-gnu)   sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            armv7-unknown-linux-gnueabihf) sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf ;;
            *) echo "No extra toolchain needed for $TARGET" ;;
          esac

      - name: Build bridge (${{ inputs.profile || 'release' }})
        run: |
          PROFILE="${{ inputs.profile || 'release' }}"
          if [ "$PROFILE" = "release" ]; then
            cargo build --release --target ${{ inputs.target || 'x86_64-unknown-linux-gnu' }}
          else
            cargo build --target ${{ inputs.target || 'x86_64-unknown-linux-gnu' }}
          fi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc

      - name: Set library path output
        id: set-lib-path
        run: |
          PROFILE="${{ inputs.profile || 'release' }}"
          echo "lib-path=bridge/target/${{ inputs.target || 'x86_64-unknown-linux-gnu' }}/${PROFILE}/libsing_box_reticulum_bridge.a" >> "$GITHUB_OUTPUT"

      - name: Upload bridge static library
        uses: actions/upload-artifact@v4
        with:
          name: libsing_box_reticulum_bridge-${{ inputs.target || 'x86_64-unknown-linux-gnu' }}-${{ inputs.profile || 'release' }}
          path: bridge/target/${{ inputs.target || 'x86_64-unknown-linux-gnu' }}/${{ inputs.profile || 'release' }}/libsing_box_reticulum_bridge.a
          if-no-files-found: error
          retention-days: 1

  build_android:
    name: Build Android (aarch64)
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true

      - name: Set up NDK toolchain
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> $GITHUB_PATH

          # NDK r28 wrapper scripts call bare "clang"/"clang++" but only clang-XX exists.
          # Create the missing symlinks so the wrappers can execute.
          CLANG_BIN=$(find "$NDK_BIN" -maxdepth 1 -name 'clang-[0-9]*' ! -name '*++*' -type f 2>/dev/null | sort -V | tail -1)
          [[ -n "$CLANG_BIN" && ! -e "$NDK_BIN/clang" ]] && ln -sf "$CLANG_BIN" "$NDK_BIN/clang"
          CLANGPP_BIN=$(find "$NDK_BIN" -maxdepth 1 -name 'clang++-[0-9]*' -type f 2>/dev/null | sort -V | tail -1)
          [[ -n "$CLANGPP_BIN" && ! -e "$NDK_BIN/clang++" ]] && ln -sf "$CLANGPP_BIN" "$NDK_BIN/clang++"

          # cc-rs looks for aarch64-linux-android-clang (no API level); create a symlink
          ln -sf "$NDK_BIN/aarch64-linux-android21-clang" "$NDK_BIN/aarch64-linux-android-clang"

          # clang driver looks for ld.lld beside its own binary; create it if missing
          if [[ ! -x "$NDK_BIN/ld.lld" ]]; then
            LLD=$(find "$NDK_BIN" -maxdepth 1 \( -name 'lld' -o -name 'lld-[0-9]*' \) -type f 2>/dev/null | sort -V | tail -1)
            [[ -n "$LLD" ]] && ln -sf "$LLD" "$NDK_BIN/ld.lld"
          fi

      - name: Build for Android (debug)
        run: cargo build --target aarch64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: "-C link-arg=-fPIC -C link-arg=--ld-path=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld"

      - name: Build for Android (release)
        run: cargo build --target aarch64-linux-android --release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: "-C link-arg=-fPIC -C link-arg=--ld-path=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld"

      - name: List artifacts
        run: |
          echo "=== Debug artifacts ==="
          ls -lh target/aarch64-linux-android/debug/ | grep -E '\.(a|so)$' || echo "No .a/.so files in debug"
          echo "=== Release artifacts ==="
          ls -lh target/aarch64-linux-android/release/ | grep -E '\.(a|so)$' || echo "No .a/.so files in release"